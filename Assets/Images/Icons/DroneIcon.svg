<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64"
     fill="none">

  <!-- Drone -->
  <g transform="rotate(20 32 32)"
     stroke="#FFFFFF"
     stroke-linecap="round">

    <!-- Arms -->
    <line x1="32" y1="32" x2="20" y2="20" stroke-width="1.2"/>
    <line x1="32" y1="32" x2="44" y2="20" stroke-width="1.2"/>
    <line x1="32" y1="32" x2="20" y2="44" stroke-width="1.2"/>
    <line x1="32" y1="32" x2="44" y2="44" stroke-width="1.2"/>

    <!-- Motor rings -->
    <circle cx="20" cy="20" r="3.6" stroke-width="0.96"/>
    <circle cx="44" cy="20" r="3.6" stroke-width="0.96"/>
    <circle cx="20" cy="44" r="3.6" stroke-width="0.96"/>
    <circle cx="44" cy="44" r="3.6" stroke-width="0.96"/>

    <!-- Center body -->
    <rect x="28.88"
          y="28.88"
          width="6.24"
          height="6.24"
          rx="0.72"
          fill="#FFFFFF"
          stroke="none"/>
  </g>

   <!-- Crashed motor -->
   <line x1="45" y1="46" x2="37" y2="54"
         stroke="#ff3c00"
         stroke-width="1.5"/>

   <line x1="45" y1="54" x2="37" y2="46"
         stroke="#ff3c00"
         stroke-width="1.5"/>
