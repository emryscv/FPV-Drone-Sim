<svg xmlns="http://www.w3.org/2000/svg"
     width="24"
     height="24"
     viewBox="0 0 24 24"
     fill="none">

  <g stroke="#FFFFFF"
     stroke-linecap="round">
     
    <!-- Arms -->
    <line x1="12" y1="12" x2="3.6"  y2="3.6"  stroke-width="1.2"/>
    <line x1="12" y1="12" x2="20.4" y2="3.6"  stroke-width="1.2"/>
    <line x1="12" y1="12" x2="3.6"  y2="20.4" stroke-width="1.2"/>
    <line x1="12" y1="12" x2="20.4" y2="20.4" stroke-width="1.2"/>

    <!-- Motor rings -->
    <circle cx="3.6"  cy="3.6"  r="3.6" stroke-width="0.96"/>
    <circle cx="20.4" cy="3.6"  r="3.6" stroke-width="0.96"/>
    <circle cx="3.6"  cy="20.4" r="3.6" stroke-width="0.96"/>
    <circle cx="20.4" cy="20.4" r="3.6" stroke-width="0.96"/>

    <!-- Propeller bars -->
    <line x1="0"    y1="3.6"  x2="7.2" y2="3.6"  stroke-width="0.84"/>
    <line x1="16.8" y1="3.6"  x2="24"  y2="3.6"  stroke-width="0.84"/>
    <line x1="0"    y1="20.4" x2="7.2" y2="20.4" stroke-width="0.84"/>
    <line x1="16.8" y1="20.4" x2="24"  y2="20.4" stroke-width="0.84"/>
  </g>

  <!-- Center body -->
  <rect x="8.88"
        y="8.88"
        width="6.24"
        height="6.24"
        rx="0.72"
        fill="#FFFFFF"/>
</svg>